const VARKEYS = ["IP","DOMAIN","DC","USER","PASS","KALI","PORT","HASH","IFACE"];
const VARLABELS = {IP:"TARGET IP",DOMAIN:"DOMAIN",DC:"DC HOST / IP",USER:"USER",PASS:"PASSWORD",KALI:"KALI IP (tun0)",PORT:"PORT",HASH:"NT HASH",IFACE:"INTERFACE (tun0)"};
const EXAMPLE = {IP:"192.168.10.5",DOMAIN:"citc.local",DC:"192.168.10.1",USER:"mew",PASS:"123456789",KALI:"10.10.14.7",PORT:"9001",HASH:"31d6cfe0d16ae931b73c59d7e0c089c0",IFACE:"tun0"};
let vars = {};
let activeTab = "all";

// load saved vars
try{ const s=localStorage.getItem("burn_vars"); if(s) vars=JSON.parse(s); }catch(e){}

function saveVars(){ try{ localStorage.setItem("burn_vars",JSON.stringify(vars)); }catch(e){} }

function ph(key){ return "&lt;"+key.toLowerCase()+"&gt;"; }
function phPlain(key){ return "<"+key.toLowerCase()+">"; }

// render a template to HTML (with colored spans)
function tmplHTML(tmpl){
  return tmpl.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))
    .replace(/\{([A-Z0-9_]+)\}/g,(m,k)=>{
      if(VARKEYS.includes(k) && vars[k]) return '<span class="var-filled">'+esc(vars[k])+'</span>';
      return '<span class="var-empty">'+ph(k)+'</span>';
    });
}
// render a template to plain copyable text
function tmplPlain(tmpl){
  return tmpl.replace(/\{([A-Z0-9_]+)\}/g,(m,k)=>{
    if(VARKEYS.includes(k) && vars[k]) return vars[k];
    return phPlain(k);
  });
}
function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function tagClass(tags){
  if(tags.includes("dump")||tags.includes("abuse")) return "dump";
  if(tags.includes("privesc")) return "privesc";
  if(tags.includes("ad")||tags.includes("kerberos")||tags.includes("adcs")) return "ad";
  return "enum";
}
function tagLabel(tags){
  if(tags.includes("dump")) return "DUMP";
  if(tags.includes("abuse")) return "ACL ABUSE";
  if(tags.includes("privesc")) return "PRIVESC";
  if(tags.includes("kerberos")) return "KERBEROS";
  if(tags.includes("adcs")) return "ADCS";
  if(tags.includes("ad")) return "AD";
  if(tags.includes("web")) return "WEB";
  if(tags.includes("brute")||tags.includes("crack")) return "BRUTE";
  if(tags.includes("pivot")) return "PIVOT";
  if(tags.includes("transfer")) return "TRANSFER";
  if(tags.includes("shell")) return "SHELL";
  return "ENUM";
}

// build var panel
function buildVarPanel(){
  const g=document.getElementById("vargrid");
  g.innerHTML = VARKEYS.map(k=>
    '<div class="varfield"><label>'+VARLABELS[k]+'</label>'+
    '<input type="text" id="var_'+k+'" placeholder="'+phPlain(k)+'" value="'+(vars[k]?esc(vars[k]).replace(/"/g,"&quot;"):"")+'" oninput="onVarInput(\''+k+'\',this.value)"></div>'
  ).join("");
}
function onVarInput(k,v){ v=v.trim(); if(v) vars[k]=v; else delete vars[k]; saveVars(); rerenderCmds(); }
function clearVars(){ vars={}; saveVars(); buildVarPanel(); rerenderCmds(); }
function fillExample(){ vars=Object.assign({},EXAMPLE); saveVars(); buildVarPanel(); rerenderCmds(); }
function toggleVarPanel(){ document.getElementById("varpanel").classList.toggle("collapsed"); }

  const t=document.getElementById("navTabs");
  let h='<button class="tab-btn active" data-cat="all" onclick="filterTab(\'all\')">ALL</button>';
  DATA.cats.forEach(c=>{ h+='<button class="tab-btn" data-cat="'+c.id+'" onclick="filterTab(\''+c.id+'\')">'+c.tab+'</button>'; });
  t.innerHTML=h;
}

// build all sections
function buildSections(){
  const m=document.getElementById("mainContent");
  let html="";
  DATA.cats.forEach(cat=>{
    const cmds=DATA.cmds.filter(x=>x.cat===cat.id);
    if(!cmds.length) return;
    html+='<div class="section" data-cat="'+cat.id+'">';
    html+='<div class="section-title">'+cat.icon+' '+cat.tab+'</div>';
    html+='<div class="section-desc">'+esc(cat.desc)+'</div>';
    html+='<div class="cards-grid">';
    cmds.forEach((cmd,i)=>{
      const idx=DATA.cmds.indexOf(cmd);
      html+='<div class="card">';
      html+='<div class="card-title">'+esc(cmd.tool)+'</div>';
      html+='<span class="tag '+tagClass(cmd.t)+'">'+tagLabel(cmd.t)+'</span>';
      html+='<div class="cmd-row">';
      html+='<div class="cmd" data-idx="'+idx+'" onclick="copyCmd(this)"><span class="cmd-txt">'+tmplHTML(cmd.c)+'</span><span class="copied-badge">✓ copied</span></div>';
      html+='<button class="explain-btn" title="อธิบาย" onclick="openModal('+idx+')">!</button>';
      html+='</div>';
      html+='<div class="cmd-note">'+esc(cmd.n)+'</div>';
      html+='</div>';
    });
    html+='</div></div>';
  });
  m.innerHTML=html;
}

// re-render command text spans when vars change
function rerenderCmds(){
  document.querySelectorAll(".cmd").forEach(el=>{
    const idx=+el.dataset.idx;
    el.querySelector(".cmd-txt").innerHTML=tmplHTML(DATA.cmds[idx].c);
  });
  // if modal open, refresh it too
  if(modalIdx>=0 && document.getElementById("modalBg").classList.contains("show")) openModal(modalIdx);
}

function copyCmd(el){
  const idx=+el.dataset.idx;
  const text=tmplPlain(DATA.cmds[idx].c);
  navigator.clipboard.writeText(text).catch(()=>{
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
  });
  el.classList.add("copied");
  setTimeout(()=>el.classList.remove("copied"),1400);
}

// MODAL
let modalIdx=-1;
function openModal(idx){
  modalIdx=idx;
  const cmd=DATA.cmds[idx];
  document.getElementById("modalTitle").textContent=cmd.tool;
  document.getElementById("modalCmd").innerHTML=tmplHTML(cmd.c);
  let h="";
  cmd.e.forEach(pair=>{
    h+='<div class="exp-item"><div class="exp-part">'+tmplHTML(pair[0])+'</div><div class="exp-desc">'+esc(pair[1])+'</div></div>';
  });
  document.getElementById("modalExp").innerHTML=h;
  document.getElementById("modalBg").classList.add("show");
}
function closeModal(){ document.getElementById("modalBg").classList.remove("show"); modalIdx=-1; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeModal(); });

// FILTER
function filterTab(cat){
  activeTab=cat;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.cat===cat));
  applyFilters();
}
function applyFilters(){
  const q=document.getElementById("searchInput").value.toLowerCase();
  document.querySelectorAll(".section").forEach(sec=>{
    const cat=sec.dataset.cat;
    const tabMatch=activeTab==="all"||cat===activeTab;
    if(!tabMatch){ sec.classList.add("hidden"); return; }
    let vis=0;
    sec.querySelectorAll(".card").forEach(card=>{
      if(!q){ card.classList.remove("hidden"); vis++; return; }
      const txt=(card.textContent||"").toLowerCase();
      if(txt.includes(q)){ card.classList.remove("hidden"); vis++; }
      else card.classList.add("hidden");
    });
    sec.classList.toggle("hidden", vis===0);
  });
  const total=document.querySelectorAll(".card:not(.hidden)").length;
  document.getElementById("counter").textContent=q?"[ "+total+" COMMANDS FOUND ]":"[ "+DATA.cmds.length+" TOTAL COMMANDS ]";
}

// INIT
buildVarPanel();
buildTabs();
buildSections();
applyFilters();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
